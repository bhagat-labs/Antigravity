services:
  campusbell:
    image: bhagatsinghs/campusbell:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: campusbell
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist the files used directly by notifier.py outside the container
      - ../timetable_data.json:/app/timetable_data.json
      - ../config.json:/app/config.json
      - ../reminder_logs.json:/app/reminder_logs.json
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health-ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

